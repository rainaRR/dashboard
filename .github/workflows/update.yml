name: 시세 자동 갱신

on:
  schedule:
    # 시간은 세계표준시(UTC)로 적습니다. 한국시간 = UTC + 9시간
    - cron: "10 7 * * 1-5"   # 한국시간 평일 오후 4시 10분 (장 마감 후)
    - cron: "0 22 * * 0-4"   # 한국시간 평일 아침 7시 (전날 미국장 마감 후)
  workflow_dispatch:          # 버튼으로 직접 실행할 때 사용

permissions:
  contents: write

# 같은 워크플로가 겹쳐 도는 것을 막습니다
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: 시세 가져오기
        timeout-minutes: 10
        run: python fetch_data.py

      - name: 공개 파일 자동 검사
        run: npm test

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --staged --quiet && exit 0
          git commit -m "시세 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 집 PC 가 같은 시각(16:10)에 kiwoom.json 을 올리면 부딪칩니다.
          # 먼저 받아서 얹은 뒤 올립니다. 세 번까지 다시 시도합니다.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "밀렸습니다. $i 번째 다시 시도합니다."
            sleep 10
          done
          echo "::error::깃허브에 올리지 못했습니다"
          exit 1
