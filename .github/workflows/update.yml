name: 시세 자동 갱신

on:
  schedule:
    - cron: "10 7 * * 1-5"
    - cron: "0 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install finance-datareader yfinance pykrx

      - name: 시세 가져오기
        timeout-minutes: 10
        run: python fetch_data.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/market.json
          git diff --staged --quiet || git commit -m "시세 갱신"
          git push
